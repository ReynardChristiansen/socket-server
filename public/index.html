<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Socket Project</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --panel: #f4f4f5;
        --border: #e4e4e7;
        --text: #18181b;
        --muted: #71717a;
        --accent: #2563eb;
        --ok: #16a34a;
        --warn: #d97706;
        --err: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --panel: #18181b;
          --border: #27272a;
          --text: #fafafa;
          --muted: #a1a1aa;
          --accent: #60a5fa;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      header strong { margin-right: auto; }
      input, button {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
      }
      input:focus-visible, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
        cursor: pointer;
      }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .dot.open { background: var(--ok); }
      .dot.connecting { background: var(--warn); }
      .dot.closed { background: var(--err); }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 200px;
        min-height: 0;
      }
      #log {
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      aside {
        border-left: 1px solid var(--border);
        background: var(--panel);
        padding: 16px;
        overflow-y: auto;
      }
      aside h2 {
        margin: 0 0 8px;
        font-size: 12px;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      aside ul { margin: 0; padding-left: 18px; }
      .msg .meta { font-size: 12px; color: var(--muted); }
      .msg .text { white-space: pre-wrap; word-break: break-word; }
      .msg.self .text { color: var(--accent); }
      .system { font-size: 13px; color: var(--muted); font-style: italic; }
      .error { font-size: 13px; color: var(--err); }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
      }
      form input { flex: 1; }
      @media (max-width: 640px) {
        main { grid-template-columns: 1fr; }
        aside { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Socket Project</strong>
      <input id="user" placeholder="nama" size="10" />
      <input id="room" placeholder="room" size="10" value="general" />
      <button id="switch" type="button">Pindah room</button>
      <span class="status"><span id="dot" class="dot"></span><span id="state">idle</span></span>
    </header>

    <main>
      <div id="log"></div>
      <aside>
        <h2>Online</h2>
        <ul id="members"></ul>
      </aside>
    </main>

    <form id="composer">
      <input id="text" placeholder="Tulis pesan..." autocomplete="off" />
      <button id="sendBtn" type="submit" disabled>Kirim</button>
    </form>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const log = $('log');

      // Origin-relative: otomatis ikut localhost / preview / production.
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const URL = `${proto}//${location.host}/api/ws`;

      const RECONNECT_MIN_MS = 1000;
      const RECONNECT_MAX_MS = 30000;

      let socket = null;
      let reconnectDelay = RECONNECT_MIN_MS;
      let reconnectTimer = null;

      const state = {
        user: localStorage.getItem('user') || `user-${Math.floor(Math.random() * 1000)}`,
        room: localStorage.getItem('room') || 'general',
      };
      $('user').value = state.user;
      $('room').value = state.room;

      function setStatus(kind, label) {
        $('dot').className = `dot ${kind}`;
        $('state').textContent = label;
        $('sendBtn').disabled = kind !== 'open';
      }

      function scrolledToBottom() {
        return log.scrollHeight - log.scrollTop - log.clientHeight < 60;
      }

      function append(node) {
        const stick = scrolledToBottom();
        log.append(node);
        if (stick) log.scrollTop = log.scrollHeight;
      }

      function renderChat(msg) {
        const el = document.createElement('div');
        el.className = msg.user === state.user ? 'msg self' : 'msg';
        const time = new Date(msg.ts).toLocaleTimeString('id-ID', {
          hour: '2-digit',
          minute: '2-digit',
        });
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `${msg.user} · ${time}`;
        const text = document.createElement('div');
        text.className = 'text';
        text.textContent = msg.text;
        el.append(meta, text);
        append(el);
      }

      function renderNote(text, className = 'system') {
        const el = document.createElement('div');
        el.className = className;
        el.textContent = text;
        append(el);
      }

      function renderMembers(members) {
        $('members').replaceChildren(
          ...members.map((name) => {
            const li = document.createElement('li');
            li.textContent = name;
            return li;
          }),
        );
      }

      function send(payload) {
        if (socket?.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify(payload));
        }
      }

      function connect() {
        clearTimeout(reconnectTimer);
        setStatus('connecting', 'menyambung...');
        socket = new WebSocket(URL);

        socket.addEventListener('open', () => {
          // 1. reset backoff
          reconnectDelay = RECONNECT_MIN_MS;
          setStatus('open', 'tersambung');
          // 2. resubscribe — server menganggap join sebagai subscribe ke room
          // 3. reload state — server membalas join dengan history + presence
          send({ type: 'join', room: state.room, user: state.user });
        });

        socket.addEventListener('message', (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }

          switch (msg.type) {
            case 'welcome':
              if (!msg.redis) {
                renderNote('Server jalan tanpa Redis — history & presence kosong.', 'error');
              }
              break;
            case 'history':
              log.replaceChildren();
              msg.messages.forEach(renderChat);
              log.scrollTop = log.scrollHeight;
              break;
            case 'chat':
              renderChat(msg);
              break;
            case 'presence':
              renderMembers(msg.members);
              break;
            case 'system':
              renderNote(msg.text);
              break;
            case 'error':
              renderNote(msg.text, 'error');
              break;
          }
        });

        socket.addEventListener('close', () => {
          setStatus('closed', `putus, coba lagi ${reconnectDelay / 1000}s`);
          reconnectTimer = setTimeout(connect, reconnectDelay);
          reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
        });

        socket.addEventListener('error', () => socket.close());
      }

      $('composer').addEventListener('submit', (event) => {
        event.preventDefault();
        const text = $('text').value.trim();
        if (!text) return;
        send({ type: 'chat', text });
        $('text').value = '';
      });

      $('switch').addEventListener('click', () => {
        state.user = $('user').value.trim() || state.user;
        state.room = $('room').value.trim() || state.room;
        localStorage.setItem('user', state.user);
        localStorage.setItem('room', state.room);
        log.replaceChildren();
        send({ type: 'join', room: state.room, user: state.user });
      });

      connect();
    </script>
  </body>
</html>
